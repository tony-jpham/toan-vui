<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Học bảng cửu chương — Toán Vui</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<!-- Google tag (gtag.js): chỉ tải trên website production. -->
<script>
  if (
    location.hostname === 'tony-jpham.github.io' &&
    location.pathname.startsWith('/toan-vui/')
  ) {
    var gaScript = document.createElement('script');
    gaScript.async = true;
    gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-WPFRJK3EH4';
    document.head.appendChild(gaScript);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){window.dataLayer.push(arguments);};
    window.gtag('js', new Date());
    window.gtag('config', 'G-WPFRJK3EH4');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="logo">🧮 Toán Vui</a>
  <span class="greeting" id="greeting"></span>
</header>

<main class="container">
  <a href="../menu.html" class="breadcrumb">← Về menu chính</a>
  <h1 class="center">Học bảng cửu chương 📖</h1>

  <div class="card">
    <label for="table-select">Chọn bảng bé muốn học:</label>
    <div class="option-grid" id="table-buttons">
      <!-- generated -->
    </div>
  </div>

  <div class="card" id="table-display-card" style="display:none;">
    <h2 class="center" id="table-title"></h2>
    <div class="table-display" id="table-display"></div>
    <div class="center" style="margin-top: 20px;">
      <a href="luyen-tap.html" class="btn btn-primary">Luyện tập ngay 🎯</a>
    </div>
  </div>
</main>

<footer class="app-footer">Toán Vui 🧮 — Học mà chơi, chơi mà học</footer>

<script src="../js/profile.js"></script>
<script>
  requireProfileOrRedirect();
  renderGreeting('greeting');

  const buttonsEl = document.getElementById('table-buttons');
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'option-chip';
    btn.textContent = 'Bảng ' + n;
    btn.addEventListener('click', () => showTable(n, btn));
    buttonsEl.appendChild(btn);
  }

  function showTable(n, activeBtn) {
    document.querySelectorAll('.option-chip').forEach((b) => b.classList.remove('selected'));
    activeBtn.classList.add('selected');

    document.getElementById('table-display-card').style.display = 'block';
    document.getElementById('table-title').textContent = `Bảng nhân ${n} 🌟`;

    const displayEl = document.getElementById('table-display');
    displayEl.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const row = document.createElement('div');
      row.className = 'table-row';
      row.innerHTML = `<span>${n} × ${i}</span><span>= ${n * i}</span>`;
      displayEl.appendChild(row);
    }
    document.getElementById('table-display-card').scrollIntoView({ behavior: 'smooth' });
  }
</script>
</body>
</html>
