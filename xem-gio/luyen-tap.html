<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Xem giờ đồng hồ — Toán Vui</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">

    location.pathname.startsWith('/toan-vui/')
  ) {
    var gaScript = document.createElement('script');

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">

<body>

<header class="app-header">
  <a href="../menu.html" class="logo">🧮 Toán Vui</a>
  <span class="greeting" id="greeting"></span>
</header>

<main class="container">

  <section id="setup-section">
    <a href="../menu.html" class="breadcrumb">← Về menu chính</a>
    <h1 class="center">Xem giờ đồng hồ 🕐</h1>
    <p class="subtitle center">10 câu, đọc giờ trên đồng hồ kim. Bé cùng thử nhé!</p>
    <div class="card center">
      <button id="start-btn" class="btn btn-primary">Bắt đầu 🎯</button>
    </div>
  </section>

  <section id="quiz-section" style="display:none;">
    <div class="quiz-meta">
      <span>Câu <span id="q-current">1</span>/<span id="q-total">10</span></span>
      <button id="exit-btn" class="exit-btn" aria-label="Thoát bài">✕</button>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="card">
      <div id="clock-holder" style="text-align:center; margin-bottom: 12px;"></div>
    </div>
    <div id="q-feedback" class="feedback-banner" style="display:none;"></div>
    <div class="answers-grid" id="q-answers"></div>
  </section>

  <section id="result-section" style="display:none;">
    <div class="card center">
      <div style="font-size: 3rem;">🎉</div>
      <h2>Hoàn thành!</h2>
      <div class="result-score" id="result-score"></div>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-message" id="result-message"></p>
      <div class="btn-row">
        <button id="retry-btn" class="btn btn-primary">Làm lại</button>
        <a href="../menu.html" class="btn btn-outline">Về menu chính</a>
      </div>
    </div>
  </section>

</main>

<footer class="app-footer">Toán Vui 🧮 — Học mà chơi, chơi mà học</footer>

<!-- q-prompt cần tồn tại cho QuizEngine dù không hiển thị (nội dung câu hỏi là mặt đồng hồ SVG) -->
<div id="q-prompt" style="display:none;"></div>

<script src="../js/profile.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/quiz-engine.js"></script>
<script src="../js/exit-confirm.js"></script>
<script src="../js/history.js"></script>
<script src="../js/clock-render.js"></script>
<script src="../js/xem-gio.js"></script>
<script>
  requireProfileOrRedirect();
  renderGreeting('greeting');

  let engine = null;
  let questions = [];

  setupExitConfirm({
    exitBtnId: 'exit-btn',
    redirectUrl: '../menu.html',
    onConfirmExit: () => engine && engine.stop(),
  });

  document.getElementById('start-btn').addEventListener('click', launchQuiz);

  function launchQuiz() {
    questions = buildClockQuiz(10);
    document.getElementById('setup-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';

    engine = new QuizEngine({
      questions,
      containerIds: {
        progressFill: 'progress-fill',
        current: 'q-current',
        total: 'q-total',
        prompt: 'q-prompt',
        answers: 'q-answers',
        feedback: 'q-feedback',
      },
      onFinish: (score, total) => showResult(score, total),
    });

    const originalRender = engine.renderQuestion.bind(engine);
    engine.renderQuestion = function () {
      originalRender();
      document.getElementById('clock-holder').innerHTML = this.questions[this.currentIndex].clockSVG;
    };

    engine.start();
  }

  function showResult(score, total) {
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';
    const scaledScore = Math.round((score / total) * 10);
    renderResultScreen({
      score,
      total,
      scaledScore,
      containerIds: { score: 'result-score', detail: 'result-detail', message: 'result-message' },
    });
    saveHistoryEntry({
      module: 'xem-gio',
      score,
      total,
      scaledScore,
    });
  }

  document.getElementById('retry-btn').addEventListener('click', launchQuiz);
</script>
</body>
</html>
