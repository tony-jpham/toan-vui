<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="description" content="Toán Vui — người bạn đồng hành ôn tập Toán tiểu học: bảng cửu chương, cộng trừ và xem giờ đồng hồ qua các bài trắc nghiệm vui nhộn.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/components.css">
</head>
<body>

<main class="container" style="padding-top: 60px;">
  <div class="center" style="margin-bottom: 28px;">
    <div style="font-size: 4rem;">🌈✨</div>
    <h1>Toán Vui</h1>
    <p class="subtitle">Mình là Toán Vui, cùng bạn ôn Toán thật vui mỗi ngày nhé!</p>
  </div>

  <div class="card" id="profile-form-card">
    <h2 class="center">Bạn tên gì vậy? 😊</h2>
    <form id="profile-form">
      <div class="field">
        <label for="child-name">Tên của bạn</label>
        <input type="text" id="child-name" placeholder="Ví dụ: Bin" maxlength="30" required>
      </div>
      <div class="field">
        <label for="child-age">Bạn mấy tuổi rồi?</label>
        <input type="number" id="child-age" placeholder="Ví dụ: 8" min="5" max="12" required>
      </div>
      <div class="field">
        <label>Chọn một hình đại diện nhé</label>
        <div class="avatar-grid" id="avatar-grid"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Bắt đầu học 🚀</button>
    </form>
  </div>

  <div class="card center" id="welcome-back-card" style="display:none;">
    <div style="font-size: 3rem;">👋</div>
    <h2 id="welcome-back-text"></h2>
    <p class="subtitle">Sẵn sàng ôn tập tiếp chưa nào?</p>
    <div class="btn-row" style="margin-top: 16px;">
      <a href="menu.html" class="btn btn-primary">Vào học ngay 🎈</a>
      <button id="switch-profile-btn" class="btn btn-outline">Đổi người khác</button>
    </div>
  </div>
</main>

<div id="app-footer-slot"></div>

<script src="js/profile.js"></script>
<script src="js/layout.js"></script>
<script>
  renderAppFooter();

  let selectedAvatar = AVATAR_OPTIONS[0];

  const avatarGridEl = document.getElementById('avatar-grid');
  AVATAR_OPTIONS.forEach((emoji) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'avatar-choice';
    btn.textContent = emoji;
    btn.addEventListener('click', () => {
      selectedAvatar = emoji;
      avatarGridEl.querySelectorAll('.avatar-choice').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    avatarGridEl.appendChild(btn);
  });
  avatarGridEl.firstElementChild.classList.add('selected');

  (function init() {
    const profile = getProfile();
    if (profile) {
      document.getElementById('profile-form-card').style.display = 'none';
      document.getElementById('welcome-back-card').style.display = 'block';
      document.getElementById('welcome-back-text').textContent = `Chào mừng ${profile.name} quay lại!`;
    }
  })();

  document.getElementById('profile-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('child-name').value.trim();
    const age = parseInt(document.getElementById('child-age').value, 10);
    if (!name || !age) return;
    saveProfile(name, age, selectedAvatar);
    window.location.href = 'menu.html';
  });

  document.getElementById('switch-profile-btn')?.addEventListener('click', function () {
    clearProfile();
    document.getElementById('welcome-back-card').style.display = 'none';
    document.getElementById('profile-form-card').style.display = 'block';
  });
</script>
</body>
</html>
