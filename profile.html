<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="app-header">
  <a href="menu.html" class="logo">🧮 Toán Vui</a>
</header>

<main class="container">
  <a href="menu.html" class="breadcrumb">← Về menu chính</a>
  <h1 class="center">Hồ sơ của bé 🧸</h1>

  <div class="card">
    <div class="avatar-preview" id="avatar-preview"></div>
    <form id="profile-edit-form">
      <div class="field">
        <label for="child-name">Tên của bé</label>
        <input type="text" id="child-name" placeholder="Ví dụ: Bin" maxlength="30" required>
      </div>
      <div class="field">
        <label for="child-age">Bé mấy tuổi rồi?</label>
        <input type="number" id="child-age" placeholder="Ví dụ: 8" min="5" max="12" required>
      </div>
      <div class="field">
        <label>Chọn hình đại diện</label>
        <div class="avatar-grid" id="avatar-grid"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Lưu thay đổi ✅</button>
    </form>
  </div>

  <div class="card center">
    <p class="subtitle">Xem lại kết quả các bài đã luyện tập trong 7 ngày qua</p>
    <a href="history.html" class="btn btn-secondary">Xem lịch sử luyện tập 📊</a>
  </div>

  <div class="card center">
    <p class="subtitle">Muốn đổi sang bé khác dùng máy này?</p>
    <button id="switch-profile-btn" class="btn btn-outline">Đổi bé khác</button>
  </div>
</main>

<footer class="app-footer">Toán Vui 🧮 — Học mà chơi, chơi mà học</footer>

<script src="js/profile.js"></script>
<script>
  const profile = requireProfileOrRedirect();
  let selectedAvatar = profile ? profile.avatar : AVATAR_OPTIONS[0];

  document.getElementById('avatar-preview').textContent = selectedAvatar;
  document.getElementById('child-name').value = profile.name;
  document.getElementById('child-age').value = profile.age;

  const avatarGridEl = document.getElementById('avatar-grid');
  AVATAR_OPTIONS.forEach((emoji) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'avatar-choice' + (emoji === selectedAvatar ? ' selected' : '');
    btn.textContent = emoji;
    btn.addEventListener('click', () => {
      selectedAvatar = emoji;
      avatarGridEl.querySelectorAll('.avatar-choice').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('avatar-preview').textContent = selectedAvatar;
    });
    avatarGridEl.appendChild(btn);
  });

  document.getElementById('profile-edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('child-name').value.trim();
    const age = parseInt(document.getElementById('child-age').value, 10);
    if (!name || !age) return;
    saveProfile(name, age, selectedAvatar);
    window.location.href = 'menu.html';
  });

  document.getElementById('switch-profile-btn').addEventListener('click', function () {
    clearProfile();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
