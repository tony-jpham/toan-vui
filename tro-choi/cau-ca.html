<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Câu cá — Toán Vui</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div id="app-header-slot"></div>

<main class="container">

  <section id="setup-section">
    <a href="menu.html" class="breadcrumb">← Menu</a>
    <h1 class="center">Câu cá 🎣</h1>
    <p class="subtitle center">10 câu cộng trừ và xem giờ trộn lẫn. Trả lời đúng để câu được cá nhé!</p>
    <div class="card center">
      <button id="start-btn" class="btn btn-primary">Bắt đầu câu 🐟</button>
    </div>
  </section>

  <section id="quiz-section" style="display:none;">
    <div class="quiz-meta">
      <span>Câu <span id="q-current">1</span>/<span id="q-total">10</span></span>
      <button id="exit-btn" class="exit-btn" aria-label="Thoát bài">✕</button>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>

    <div class="fish-tank">
      <div class="rod-icon">🎣</div>
      <div class="fish-count-badge" id="fish-count-badge">0 con</div>
      <div class="fish-list" id="fish-list"></div>
    </div>
    <div class="race-feedback" id="fish-feedback"></div>

    <div class="card">
      <div id="clock-holder" style="text-align:center;"></div>
      <div class="question-text center" id="q-prompt-display"></div>
    </div>
    <div id="q-feedback" class="feedback-banner" style="display:none;"></div>
    <div class="answers-grid" id="q-answers"></div>
  </section>

  <section id="result-section" style="display:none;">
    <div class="card center">
      <div style="font-size: 3rem;" id="result-emoji">🎣</div>
      <h2 id="result-title">Kết thúc buổi câu!</h2>
      <div class="result-score" id="result-score"></div>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-message" id="result-message"></p>
      <div class="fish-collection-grid" id="fish-collection-grid"></div>
    </div>
    <div class="btn-row" style="margin-top: 16px;">
      <button id="retry-btn" class="btn btn-primary">Câu lại</button>
      <a href="../menu.html" class="btn btn-outline">Về menu chính</a>
    </div>
  </section>

</main>

<div id="app-footer-slot"></div>

<!-- q-prompt cần tồn tại cho QuizEngine dù không hiển thị trực tiếp -->
<div id="q-prompt" style="display:none;"></div>

<script src="../js/profile.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/quiz-engine.js"></script>
<script src="../js/exit-confirm.js"></script>
<script src="../js/history.js"></script>
<script src="../js/badges.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/clock-render.js"></script>
<script src="../js/xem-gio.js"></script>
<script src="../js/cong-tru.js"></script>
<script src="../js/mixed-questions.js"></script>
<script src="../js/cau-ca.js"></script>
<script>
  const profile = requireProfileOrRedirect();
  renderAppHeader({ logoHref: '../menu.html', showGreeting: true });
  renderAppFooter();
  renderGreeting('greeting');

  const TOTAL_QUESTIONS = 10;

  let engine = null;
  let caughtFish = [];

  setupExitConfirm({
    exitBtnId: 'exit-btn',
    redirectUrl: '../menu.html',
    onConfirmExit: () => engine && engine.stop(),
  });

  document.getElementById('start-btn').addEventListener('click', launchGame);

  function launchGame() {
    const questions = buildMixedQuestions(TOTAL_QUESTIONS);
    caughtFish = [];

    document.getElementById('fish-count-badge').textContent = '0 con';
    document.getElementById('fish-list').innerHTML = '';
    document.getElementById('fish-feedback').textContent = '';

    document.getElementById('setup-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';

    engine = new QuizEngine({
      questions,
      onAnswered: (isCorrect) => catchFish(isCorrect),
      onFinish: (score, total) => finishGame(score, total),
    });

    attachMixedQuestionRenderer(engine, { clockHolderId: 'clock-holder', promptDisplayId: 'q-prompt-display' });

    engine.start();
  }

  function catchFish(isCorrect) {
    const feedbackEl = document.getElementById('fish-feedback');
    if (isCorrect) {
      const fish = pickRandomFish();
      caughtFish.push(fish);
      document.getElementById('fish-count-badge').textContent = `${caughtFish.length} con`;
      document.getElementById('fish-list').innerHTML = caughtFish.map((f) => `<span>${f}</span>`).join('');
      feedbackEl.textContent = `Câu được ${fish} rồi! 🎉`;
    } else {
      feedbackEl.textContent = 'Chưa câu được, thử câu sau nhé! 💪';
    }
  }

  function finishGame(score, total) {
    showResultSection();
    const scaledScore = Math.round((score / total) * 10);

    document.getElementById('result-title').textContent = `${profile.name} câu được ${caughtFish.length} con cá! 🎉`;

    renderResultScreen({ score, total, scaledScore });

    const gridEl = document.getElementById('fish-collection-grid');
    const slots = Array.from({ length: total }, (_, i) => caughtFish[i] || null);
    gridEl.innerHTML = slots.map((fish) => `
      <div class="fish-slot${fish ? '' : ' empty'}">${fish || '?'}</div>
    `).join('');

    recordQuizCompletion({ module: 'cau-ca', score, total, scaledScore });
  }

  document.getElementById('retry-btn').addEventListener('click', launchGame);
</script>
</body>
</html>
