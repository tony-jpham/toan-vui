<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Đảo Chìm — Toán Vui</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div id="app-header-slot"></div>

<main class="container">

  <section id="setup-section">
    <a href="menu.html" class="breadcrumb">← Menu</a>
    <h1 class="center">Đảo Chìm 🏝️</h1>
    <p class="subtitle center">Nước đang dâng lên! Trả lời đúng thật nhanh để ném phao cứu sinh nhé!</p>

    <div class="card">
      <p>15 câu cộng trừ, có tính giờ cho cả bài. Chọn độ khó nhé:</p>
      <div class="btn-row">
        <button class="btn btn-outline" data-level="vua">🙂 Vừa (3 phút 45 giây)</button>
        <button class="btn btn-outline" data-level="kho">😤 Khó (3 phút)</button>
      </div>
    </div>
  </section>

  <section id="quiz-section" style="display:none;">
    <div class="quiz-meta">
      <span>Câu <span id="q-current">1</span>/<span id="q-total">15</span></span>
      <div class="quiz-meta-right">
        <span class="timer" id="timer-display">03:45</span>
        <button id="exit-btn" class="exit-btn" aria-label="Thoát bài">✕</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>

    <div class="island-stats">
      <span>Mực nước</span>
      <span class="water-level-label" id="water-level-label">0%</span>
    </div>
    <div class="island-box">
      <div class="island-lifebuoy" id="lifebuoy">🛟</div>
      <div class="island-palm">🌴</div>
      <div class="island-castaway" id="castaway">🧍</div>
      <div class="island-shape"></div>
      <div class="island-water" id="island-water"></div>
    </div>
    <div class="race-feedback" id="island-feedback"></div>

    <div class="card question-box">
      <div class="question-text" id="q-prompt"></div>
    </div>
    <div id="q-feedback" class="feedback-banner" style="display:none;"></div>
    <div class="answers-grid" id="q-answers"></div>
  </section>

  <section id="result-section" style="display:none;">
    <div class="card center">
      <div style="font-size: 3rem;" id="result-emoji">🎉</div>
      <h2 id="result-title">Được cứu rồi!</h2>
      <div class="result-score" id="result-score"></div>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-message" id="result-message"></p>
      <div class="btn-row">
        <button id="retry-btn" class="btn btn-primary">Chơi lại</button>
        <a href="../menu.html" class="btn btn-outline">Về menu chính</a>
      </div>
    </div>
  </section>

</main>

<div id="app-footer-slot"></div>

<script src="../js/profile.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/quiz-engine.js"></script>
<script src="../js/exit-confirm.js"></script>
<script src="../js/history.js"></script>
<script src="../js/badges.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/cong-tru.js"></script>
<script>
  const profile = requireProfileOrRedirect();
  renderAppHeader({ logoHref: '../menu.html', showGreeting: true });
  renderAppFooter();
  renderGreeting('greeting');

  const WATER_MAX_PCT = 82; // % — chừa chỗ để nhân vật/cây dừa không bị nước che khuất hoàn toàn
  const RESCUE_BONUS_PCT = 4; // mỗi câu đúng đẩy lùi mực nước bấy nhiêu %, tách khỏi mốc thời gian thô

  let currentLevel = null;
  let engine = null;
  let timerInterval = null;
  let secondsLeft = 0;
  let totalSeconds = 0;
  let timeUp = false;
  let rescueBonus = 0; // tổng % đã đẩy lùi được nhờ trả lời đúng

  setupExitConfirm({
    exitBtnId: 'exit-btn',
    redirectUrl: '../menu.html',
    onConfirmExit: () => {
      clearInterval(timerInterval);
      if (engine) engine.stop();
    },
  });

  document.querySelectorAll('[data-level]').forEach((btn) => {
    btn.addEventListener('click', () => launchGame(btn.dataset.level));
  });

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function launchGame(level) {
    currentLevel = level;
    timeUp = false;
    rescueBonus = 0;
    const questions = buildCongTruQuiz(level, 15);
    totalSeconds = SPEED_CHALLENGE_SECONDS[level];
    secondsLeft = totalSeconds;

    document.getElementById('setup-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    document.getElementById('island-feedback').textContent = '';
    updateTimerDisplay();
    updateWaterLevel();

    engine = new QuizEngine({
      questions,
      onAnswered: (isCorrect) => onAnswered(isCorrect),
      onFinish: (score, total) => finishGame(score, total),
    });
    engine.start();

    clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
  }

  function tick() {
    secondsLeft--;
    updateTimerDisplay();
    updateWaterLevel();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      timeUp = true;
      engine.stop();
      ToanVuiSound.playFinish();
      finishGame(engine.score, engine.questions.length);
    }
  }

  function onAnswered(isCorrect) {
    const feedbackEl = document.getElementById('island-feedback');
    if (isCorrect) {
      rescueBonus += RESCUE_BONUS_PCT;
      showLifebuoyThrow();
      feedbackEl.textContent = 'Ném phao trúng rồi, nước rút xuống chút! 🛟';
    } else {
      feedbackEl.textContent = 'Chưa kịp ném phao, nước vẫn đang dâng! 💦';
    }
    updateWaterLevel();
  }

  function updateWaterLevel() {
    const elapsedPct = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
    const pct = Math.max(0, Math.min(WATER_MAX_PCT, elapsedPct - rescueBonus));
    document.getElementById('island-water').style.height = pct + '%';
    document.getElementById('water-level-label').textContent = Math.round(pct) + '%';
  }

  function showLifebuoyThrow() {
    const el = document.getElementById('lifebuoy');
    el.classList.remove('show');
    // Buộc reflow để lặp lại animation nếu 2 câu đúng liên tiếp trong thời gian ngắn.
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 600);
  }

  function updateTimerDisplay() {
    const el = document.getElementById('timer-display');
    el.textContent = formatTime(Math.max(secondsLeft, 0));
    el.classList.toggle('warning', secondsLeft <= 20);
  }

  function finishGame(score, total) {
    clearInterval(timerInterval);
    showResultSection();
    const scaledScore = Math.round((score / total) * 10);

    document.getElementById('result-emoji').textContent = timeUp ? '🌊' : '🎉';
    document.getElementById('result-title').textContent = timeUp ? 'Đảo chìm mất rồi!' : 'Được cứu rồi!';

    renderResultScreen({
      score,
      total,
      scaledScore,
      message: timeUp
        ? `Bạn ném được ${score}/${total} phao trước khi đảo chìm. Luyện thêm để nhanh hơn nhé! 🏝️`
        : undefined,
    });
    recordQuizCompletion({
      module: 'dao-chim',
      levelLabel: currentLevel === 'vua' ? 'Vừa' : 'Khó',
      score,
      total,
      scaledScore,
    });
  }

  document.getElementById('retry-btn').addEventListener('click', () => launchGame(currentLevel));
</script>
</body>
</html>
